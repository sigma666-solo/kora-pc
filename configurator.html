<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kora-pc - Builder</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body id="configurator-page">
    <main class="builder">
        <!-- ============================================
             LEFT PANEL — Sidebar
             ============================================ -->
        <aside class="sidebar">
            <header class="sidebar-header">
                <a class="brand" href="index.html">
                    <span class="brand-logo"><img src="icons/лого-Photoroom.png" alt="kora-pc"></span>
                    <span class="brand-titles">
                        <span class="brand-name">Builder</span>
                        <span class="brand-sub">Your building</span>
                    </span>
                </a>
            </header>

            <div class="progress">
                <div class="progress-head">
                    <span>Progress</span>
                    <span class="progress-value" id="progress-value">0%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            </div>

            <p class="sidebar-meta" id="progress-categories">Заполнено категорий: 0 из 10</p>

            <hr class="divider">

            <nav class="category-list" id="category-list" aria-label="Component categories"></nav>

            <button type="button" class="btn-complete" id="complete-btn">Завершить</button>
        </aside>

        <!-- ============================================
             RIGHT PANEL — Workspace
             ============================================ -->
        <section class="workspace">
            <div class="workspace-top">
                <div class="search-box">
                    <input type="text" id="search-input" class="search-input" placeholder="Search" autocomplete="off">
                    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="7"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </div>

                <div class="menu-wrap">
                    <button type="button" class="menu-btn" id="menu-btn" aria-haspopup="true" aria-expanded="false" aria-label="Menu">
                        <span></span><span></span><span></span>
                    </button>
                    <div class="menu-dropdown" id="menu-dropdown">
                        <button type="button" data-action="add">Добавить товар</button>
                        <button type="button" data-action="summary">Сводка сборки</button>
                        <button type="button" data-action="reset-build">Очистить сборку</button>
                    </div>
                </div>
            </div>

            <hr class="workspace-divider">

            <!-- Filters & sort -->
            <div class="toolbar">
                <div class="filter-group">
                    <label for="filter-stock">Наличие</label>
                    <select id="filter-stock" class="toolbar-select">
                        <option value="all">Все товары</option>
                        <option value="in">Только в наличии</option>
                        <option value="out">Только не в наличии</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="filter-price-min">Цена от</label>
                    <input type="number" id="filter-price-min" class="toolbar-input" min="0" step="1" placeholder="0">
                </div>
                <div class="filter-group">
                    <label for="filter-price-max">до</label>
                    <input type="number" id="filter-price-max" class="toolbar-input" min="0" step="1" placeholder="∞">
                </div>
                <div class="filter-group">
                    <label for="sort-select">Сортировка</label>
                    <select id="sort-select" class="toolbar-select">
                        <option value="name-asc">Название (А-Я)</option>
                        <option value="name-desc">Название (Я-А)</option>
                        <option value="price-asc">Цена (по возрастанию)</option>
                        <option value="price-desc">Цена (по убыванию)</option>
                    </select>
                </div>
                <button type="button" class="toolbar-btn" id="reset-filters">Сбросить фильтры</button>
                <button type="button" class="toolbar-btn primary" id="add-product-btn">Добавить товар</button>
            </div>

            <div class="workspace-head">
                <h2 class="category-title" id="category-title">1. CPU</h2>
                <div class="counters" id="counters">
                    <span>Всего товаров: <b id="count-total">0</b></span>
                    <span>В категории: <b id="count-category">0</b></span>
                    <span>Найдено: <b id="count-found">0</b></span>
                </div>
            </div>

            <div class="messages" id="messages"></div>

            <!-- Product grid (filled by JS) -->
            <div class="product-grid" id="product-grid"></div>
        </section>
    </main>

    <!-- ============================================
         PRODUCT FORM MODAL (add / edit)
         ============================================ -->
    <div class="modal" id="product-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="product-form-title">Добавить товар</h2>
                <span class="modal-close" data-modal="product-modal">&times;</span>
            </div>
            <form id="product-form" novalidate>
                <div class="modal-body">
                    <div class="form-errors" id="form-errors"></div>
                    <div class="form-grid">
                        <div class="form-field full">
                            <label for="form-name">Название</label>
                            <input type="text" id="form-name" class="form-control" autocomplete="off" placeholder="Например: AMD Ryzen 5 5600" required>
                        </div>
                        <div class="form-field">
                            <label for="form-category">Категория</label>
                            <select id="form-category" class="form-control" required></select>
                        </div>
                        <div class="form-field">
                            <label for="form-price">Цена (₽)</label>
                            <input type="number" id="form-price" class="form-control" min="0.01" step="1" placeholder="Например: 12900" required>
                        </div>
                        <div class="form-field full">
                            <label for="form-brand">Производитель</label>
                            <input type="text" id="form-brand" class="form-control" autocomplete="off" placeholder="Например: AMD" required>
                        </div>
                        <div class="form-field full">
                            <label for="form-description">Описание</label>
                            <textarea id="form-description" class="form-control" rows="3" placeholder="Например: 6 ядер / 12 потоков, сокет AM4" required></textarea>
                        </div>
                        <div id="compatibility-fields" class="form-grid full"></div>
                        <div class="form-field full">
                            <label for="form-image">Изображение товара (необязательно)</label>
                            <input type="file" id="form-image" class="form-control" accept="image/*">
                        </div>
                        <div class="form-field checkbox full">
                            <label><input type="checkbox" id="form-instock"> В наличии</label>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-modal="product-modal">Отмена</button>
                    <button type="submit" class="btn btn-success" id="product-form-submit">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ============================================
         SUMMARY MODAL
         ============================================ -->
    <div class="modal" id="summary-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Сводка сборки</h2>
                <span class="modal-close" data-modal="summary-modal">&times;</span>
            </div>
            <div class="modal-body">
                <div class="summary-list" id="summary-list"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-modal="summary-modal">Закрыть</button>
            </div>
        </div>
    </div>

    <!-- jQuery + модули Builder (подключаются по порядку) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/store.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/render.js"></script>
    <script src="js/catalog.js"></script>
    <script src="js/form.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
